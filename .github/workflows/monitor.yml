name: Dividend Watch

on:
  push:
    branches: [main]
  schedule:
    # 14 half-hour slots, Monday–Friday 08:00 through 14:30 in Beijing (UTC+8).
    - cron: '0 0-6 * * 1-5'
    - cron: '30 0-5 * * 1-5'
    - cron: '30 6 * * 1-5'
    # 16:30 closing board, with a 17:30 retry for a missing receipt or market data.
    - cron: '30 8-9 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: "refresh 更新看板，test 向已配置渠道发送测试消息"
        type: choice
        options: [refresh, test]
        default: refresh
      test_channel:
        description: "test 模式的接收渠道"
        type: choice
        options: [all, ntfy, wxpusher, email, feishu, pushplus]
        default: all

permissions:
  contents: read

concurrency:
  group: dividend-watch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  monitor:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    timeout-minutes: 8
    outputs:
      site_ready: ${{ steps.upload.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install market data readers
        run: |
          python -m pip install -r requirements.txt
          if ! command -v pdftotext >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y poppler-utils
          fi
      - name: Verify alert rules
        run: python -m unittest discover -s tests -v
      - name: Build dashboard
        if: inputs.mode != 'test'
        run: python monitor.py
      - name: Select exchange date
        if: inputs.mode != 'test'
        id: day
        run: echo "date=$(TZ=Asia/Shanghai date +%F)" >> "$GITHUB_OUTPUT"
      - name: Restore delivery receipts
        if: github.event_name == 'schedule'
        id: restore
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: .monitor-state/sent.json
          key: sent-v1-${{ steps.day.outputs.date }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sent-v1-${{ steps.day.outputs.date }}-
      - name: Restore today's latest cloud reservation
        id: checkpoint
        if: inputs.mode != 'test'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          DAY: ${{ steps.day.outputs.date }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" |
            jq -sr --arg prefix "dividend-claims-$DAY-" --arg branch "$DEFAULT_BRANCH" --argjson repo "$GITHUB_REPOSITORY_ID" \
              '[.[] | .artifacts[] | select(.name | startswith($prefix)) | select(.workflow_run.head_branch == $branch and .workflow_run.head_repository_id == $repo)] | max_by(.id).id // empty')
          if [[ -n "$id" ]]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/dividend-claims.zip"
            mkdir -p .monitor-state
            unzip -p "$RUNNER_TEMP/dividend-claims.zip" claims.json > .monitor-state/claims.json
          fi
      - name: Reserve upcoming alerts or send manual channel test
        id: plan
        if: inputs.mode == 'test' || (github.event_name == 'schedule' && steps.restore.outcome == 'success' && steps.checkpoint.outcome == 'success')
        continue-on-error: true
        env: &alert_env
          MODE: ${{ inputs.mode == 'test' && 'test' || github.event.schedule == '30 8-9 * * 1-5' && 'postmarket' || github.event.schedule == '30 6 * * 1-5' && 'scheduled-final' || 'scheduled' }}
          DASHBOARD_URL: https://spbnb.github.io/dividend-watch/
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
          TEST_CHANNEL: ${{ inputs.test_channel || 'all' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          if [[ "$MODE" == test ]]; then
            python notify.py --mode test --channel "$TEST_CHANNEL"
          else
            python notify.py --mode "$MODE" --phase reserve
          fi
      - name: Persist reservations before contacting any channel
        id: reserve
        if: github.event_name == 'schedule' && steps.plan.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: dividend-claims-${{ steps.day.outputs.date }}-${{ github.run_id }}-${{ github.run_attempt }}-reserved
          path: .monitor-state/claims.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
      - name: Deliver fresh reserved alerts
        id: notify
        if: steps.reserve.outcome == 'success'
        continue-on-error: true
        env: *alert_env
        run: python notify.py --mode "$MODE" --phase deliver
      - name: Release expired or explicitly rejected reservations
        id: save
        if: github.event_name == 'schedule' && steps.notify.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: dividend-claims-${{ steps.day.outputs.date }}-${{ github.run_id }}-${{ github.run_attempt }}-settled
          path: .monitor-state/claims.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
      - name: Upload static site
        if: inputs.mode != 'test'
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/
      - name: Report delivery or receipt failure
        if: steps.plan.outcome == 'failure' || steps.checkpoint.outcome == 'failure' || steps.reserve.outcome == 'failure' || steps.notify.outcome == 'failure' || steps.restore.outcome == 'failure' || steps.save.outcome == 'failure'
        run: exit 1

  deploy:
    needs: monitor
    if: "!cancelled() && needs.monitor.outputs.site_ready == 'true'"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: pages
        uses: actions/deploy-pages@v4
